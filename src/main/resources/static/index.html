<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff5a36'/><path d='M5 17h6l3-7 4 13 3-6h6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M5 17h6l3-7 4 13 3-6h6"/></svg>
        </span>
        <span class="brand-name">Fit<span>Buddy</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Overview</span>
        </a>
        <a href="#/schedule" data-route="schedule">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Schedule</span>
        </a>
        <a href="#/classes" data-route="classes">
          <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2M6.5 6.5v11M17.5 6.5v11"/></svg>
          <span>Classes</span>
        </a>
        <a href="#/rooms" data-route="rooms">
          <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><circle cx="15" cy="12" r="1"/></svg>
          <span>Rooms</span>
        </a>
        <a href="#/instructors" data-route="instructors">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>Instructors</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <button class="key-btn" id="keyBtn" type="button">
          <span class="dot" id="keyDot"></span>
          <span id="keyLabel">API key</span>
        </button>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
